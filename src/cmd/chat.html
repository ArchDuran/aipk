<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIPK Chat</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --text:#e6e6e6; --dim:#9aa0aa; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--panel);
           border-bottom:1px solid #262a33; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  select { background:#22262f; color:var(--text); border:1px solid #333a46; border-radius:6px; padding:6px 8px; }
  #log { flex:1; overflow-y:auto; padding:16px; max-width:900px; width:100%; margin:0 auto; }
  .msg { margin:0 0 14px; white-space:pre-wrap; word-break:break-word; }
  .msg .who { font-size:12px; color:var(--dim); margin-bottom:2px; }
  .msg.user .body { background:#22304a; border-radius:10px; padding:8px 12px; display:inline-block; }
  .msg.assistant .body { background:var(--panel); border-radius:10px; padding:8px 12px; display:inline-block; }
  form { display:flex; gap:8px; padding:12px 16px; background:var(--panel); border-top:1px solid #262a33; }
  input[type=text] { flex:1; background:#22262f; color:var(--text); border:1px solid #333a46;
                     border-radius:8px; padding:10px 12px; font-size:15px; }
  button { background:var(--accent); color:white; border:none; border-radius:8px; padding:10px 18px;
           font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>AIPK</h1>
  <select id="model" title="Package"></select>
</header>
<div id="log"></div>
<form id="f">
  <input id="q" type="text" placeholder="Ask the package…" autocomplete="off" autofocus>
  <button id="send" type="submit">Send</button>
</form>
<script>
const log = document.getElementById('log');
const modelSel = document.getElementById('model');
const form = document.getElementById('f');
const q = document.getElementById('q');
const sendBtn = document.getElementById('send');
const history = [];

fetch('/v1/models').then(r => r.json()).then(d => {
  for (const m of (d.data || [])) {
    const o = document.createElement('option');
    o.value = o.textContent = m.id;
    modelSel.appendChild(o);
  }
});

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'user' ? 'you' : (modelSel.value || 'assistant');
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;
  div.append(who, body);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return body;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  q.value = '';
  sendBtn.disabled = true;
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  const out = addMsg('assistant', '…');
  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: modelSel.value, messages: history, stream: true }),
    });
    if (!resp.ok) throw new Error(await resp.text());
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', answer = '';
    out.textContent = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const data = line.replace(/^data: /, '').trim();
        if (!data || data === '[DONE]') continue;
        try {
          const delta = JSON.parse(data).choices?.[0]?.delta?.content;
          if (delta) { answer += delta; out.textContent = answer; log.scrollTop = log.scrollHeight; }
        } catch { /* keepalive or metadata chunk */ }
      }
    }
    history.push({ role: 'assistant', content: answer });
  } catch (err) {
    out.textContent = '[error] ' + err.message;
  } finally {
    sendBtn.disabled = false;
    q.focus();
  }
});
</script>
</body>
</html>
