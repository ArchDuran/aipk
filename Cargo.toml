[package]
name        = "aipk"
version     = "0.2.0"
edition     = "2021"
description = "Portable, verifiable AI specialist packages (.aipk) — RAG knowledge, claims/provenance, MCP tools, one signed local artifact"
license-file = "LICENSE"
readme      = "README.md"

[[bin]]
name = "aipk"
path = "src/main.rs"

[dependencies]
clap        = { version = "4", features = ["derive"] }
tokio       = { version = "1", features = ["full"] }
axum        = "0.8"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset"] }
futures-util = "0.3"
toml        = "0.8"
flate2      = "1"
anyhow      = "1"
chrono      = { version = "0.4" }
colored     = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand        = "0.8"
sha2        = "0.10"
argon2      = "0.5"
aes-gcm     = { version = "0.10", features = ["aes"] }
pdf-extract = "0.12"
zip         = { version = "2", default-features = false, features = ["deflate"] }
csv         = "1"
bincode = "1.3"
instant-distance = { version = "0.6.1", features = ["with-serde"] }

[profile.release]
opt-level = 3
lto       = true
strip     = true
